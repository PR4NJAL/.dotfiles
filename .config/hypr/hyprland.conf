monitor=,preffered,auto,auto

exec-once = uwsm app -- hyprnotify
exec-once = uwsm app -- hyprlauncher -d
exec-once = uwsm app -- clipse -listen
exec-once = uwsm app -- udiskie
exec-once = hyprpm reload -n
exec-once = uwsm app -- cairo-dock -w 5 -L

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

general {
    gaps_in = 2
    gaps_out = 5

    border_size = 2

    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true

    allow_tearing = false

    # layout = scrolling
    layout = dwindle #HACK: Change to this if breaking
}

decoration {
    rounding = 10
    rounding_power = 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade

    workspace_wraparound = true
}

# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]
windowrule {
  name = windowrule-1
  float = on
  size = 622 652
  match:class = (clipse)
}


windowrule {
  name = windowrule-2
  float = on
  pin = on
  move = ((monitor_w*0.67)) ((monitor_h*0.72))
  size = (monitor_w*0.33) (monitor_h*0.28)
  match:title = ^(Picture-in-Picture)$
}


windowrule {
  name = windowrule-3
  no_initial_focus = on
  match:xwayland = 1
}

windowrule {
  name = windowrule-4
  suppress_event = maximize
  match:class = .*
}

windowrule {
  name = windowrule-5
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
}

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace
gesture = 3, up, dispatcher, hyprexpo:expo

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# Remaining letters -> I M R U Y

bind = SUPER, E, hyprexpo:expo, toggle
bind = SUPER, T, exec, uwsm app -- kitty
bind = SUPER, Q, killactive,
bind = SUPER, N, exec, uwsm app -- nautilus
bind = SUPER, F, fullscreen,
bind = SUPER, G, togglefloating,
bind = SUPER, SPACE, exec, uwsm app -- hyprlauncher
bind = SUPER, D, pseudo, # dwindle
bind = SUPER, S, togglesplit, # dwindle
bind = SUPER, X, exec, bash ~/.local/scripts/toggle.sh
bind = SUPER, Z, exec, uwsm app -- zen-browser
bind = SUPER, P, exec, uwsm app -- hyprpicker
bind = SUPER, PRINT, exec, hyprshot -m window
bind = SHIFT, V, exec, hyprshot -m output --clipboard-only
bind = SHIFT, PRINT, exec, hyprshot -m region --freeze
bind = SUPER, V, exec, kitty --class clipse -e 'clipse' #TODO: Think of moving to non-AUR package
bind = SUPER, B, exec, uwsm app -- blueman-manager
bind = SUPER, C, exec, uwsm app -- code
bind = SUPER, W, exec, uwsm app -- webcord
bind = SUPER, O, exec, uwsm app -- chromium --app=https://chat.openai.com/
bind = SUPER, A, exec, uwsm app -- chromium --app=https://claude.ai/new/
bind = SUPER, period, layoutmsg, move +col
bind = SUPER, comma, layoutmsg, move -col
bind = SUPER SHIFT, period, layoutmsg, movewindowto r
bind = SUPER SHIFT, comma, layoutmsg, movewindowto l
bind = SUPER SHIFT, up, layoutmsg, movewindowto u
bind = SUPER SHIFT, down, layoutmsg, movewindowto d
bind = SUPER, backspace, exec, uwsm app -- wlogout

bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER SHIFT, right, resizeactive, 10 0
bind = SUPER SHIFT, left, resizeactive, -10 0
bind = SUPER SHIFT, up, resizeactive, 0 -10
bind = SUPER SHIFT, down, resizeactive, 0 10

bind = SUPER, right, swapwindow, r
bind = SUPER, left, swapwindow, l
bind = SUPER, up, swapwindow, u
bind = SUPER, down, swapwindow, d

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

bind = SUPER, M, togglespecialworkspace, magic
bind = SUPER SHIFT, M, movetoworkspace, special:magic

bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

xwayland {
  force_zero_scaling = true
  create_abstract_socket = true
}

plugin {
  hyprexpo {
    columns = 3
      gap_size = 5
      bg_col = rgb(101010)
      workspace_method = center current
      gesture_distance = 300
  }
  hyprscrolling {
    column_width = 0.7
      fullscreen_on_one_column = true
  }
}

