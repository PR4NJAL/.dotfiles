# Remaining letters -> R U O I Y A D X

bind = SUPER, RETURN, exec, uwsm app -- kitty
bind = SUPER, N, exec, uwsm app -- nautilus
bind = SUPER, Z, exec, uwsm app -- zen-browser
bind = SUPER, SPACE, exec, uwsm app -- hyprlauncher
bind = SUPER, P, exec, uwsm app -- hyprpicker
bind = SUPER, W, exec, uwsm app -- kitty sh -c 'nmtui'
bind = SUPER, B, exec, uwsm app -- blueman-manager
bind = SUPER, S, exec, uwsm app -- pavucontrol
bind = SUPER, V, exec, uwsm app -- kitty --class clipse -e 'clipse'
bind = SUPER, C, exec, uwsm app -- code
bind = SUPER, ESCAPE, exec, uwsm app -- wlogout
bind = SUPER, E, hyprexpo:expo, toggle

bind = SUPER, Q, killactive,

bind = SUPER, G, togglegroup,
bind = ALT, TAB, changegroupactive, forward
bind = ALT SHIFT, TAB, changegroupactive, back

bind = SUPER, F, fullscreen,
bind = SUPER, T, togglefloating,

bind = SUPER SHIFT, D, pseudo, # dwindle
bind = SUPER SHIFT, S, togglesplit, # dwindle

bind = SUPER, X, exec, uwsm app -- bash ~/.local/scripts/toggle.sh

bind = SUPER, PRINT, exec, uwsm app -- hyprshot -m window
bind = SUPER SHIFT, V, exec, uwsm app -- hyprshot -m output --clipboard-only
bind = SUPER SHIFT, PRINT, exec, uwsm app -- hyprshot -m region --freeze

bind = SUPER ,TAB, cyclenext,
bind = SUPER SHIFT ,TAB, cyclenext, prev

bind = SUPER, period, layoutmsg, move +col
bind = SUPER, comma, layoutmsg, move -col
bind = SUPER SHIFT, period, layoutmsg, movewindowto r
bind = SUPER SHIFT, comma, layoutmsg, movewindowto l #NOTE: I believe these are for scrolling layout

bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER, right, resizeactive, 10 0
bind = SUPER, left, resizeactive, -10 0
bind = SUPER, up, resizeactive, 0 -10
bind = SUPER, down, resizeactive, 0 10

bind = SUPER SHIFT, L, swapwindow, r
bind = SUPER SHIFT, H, swapwindow, l
bind = SUPER SHIFT, K, swapwindow, u
bind = SUPER SHIFT, J, swapwindow, d

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

bind = SUPER, M, togglespecialworkspace, magic
bind = SUPER SHIFT, M, movetoworkspace, special:magic

bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# bindel = ,XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume --inc
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindel = ,XF86AudioLower, exec, ~/.config/hypr/scripts/volume --dec
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindel = ,XF86AudioMute, exec, ~/.config/hypr/scripts/volume --toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# bindel = ,XF86AudioMicMute, exec, ~/.config/hypr/scripts/volume --toggle-mic
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
# bindel = ,XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/backlight --inc
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
# bindel = ,XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/backlight --dec

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
